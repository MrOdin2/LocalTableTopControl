name: Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build a native installer for each target OS.
  # Each runner must build from source because the JavaFX dependencies contain
  # platform-specific native libraries, so a single shared build artifact would
  # not work across Linux, Windows, and macOS.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_type: deb
            artifact_glob: '*.deb'
          - os: windows-latest
            pkg_type: exe
            artifact_glob: '*.exe'
          - os: macos-latest
            pkg_type: pkg
            artifact_glob: '*.pkg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Determine the application version:
      #   - When triggered by a version tag (e.g. v1.2.3), strip the leading "v".
      #   - When triggered by a branch push, derive from build.gradle.kts (already
      #     checked out by the preceding step) and append the short commit SHA so
      #     the build remains uniquely identifiable.
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(grep 'version\s*=' build.gradle.kts | head -1 \
                   | sed 's/.*"\(.*\)".*/\1/' | sed 's/-SNAPSHOT//')
            VERSION="${BASE}-dev+${GITHUB_SHA:0:7}"
          fi
          # jpackage requires a numeric-only version (MAJOR.MINOR[.MICRO]).
          # Fall back to "1.0" if the pattern cannot be extracted.
          PKG_VERSION=$(echo "${VERSION}" | grep -oE '^[0-9]+(\.[0-9]+)*')
          PKG_VERSION="${PKG_VERSION:-1.0}"
          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version    : ${VERSION}"
          echo "Package version: ${PKG_VERSION}"

      # WiX toolset is required by jpackage on Windows to produce .exe installers.
      - name: Install WiX toolset (Windows only)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset --no-progress -y

      - name: Build native installer
        shell: bash
        run: |
          ./gradlew :core:jpackage --no-daemon \
            -PpkgType=${{ matrix.pkg_type }} \
            -PpkgVersion=${{ steps.version.outputs.pkg_version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: core/build/jpackage/${{ matrix.artifact_glob }}

      # Produce the cross-platform distribution ZIP on Ubuntu only (once is enough).
      - name: Build distribution ZIP
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :core:distZip --no-daemon

      - name: Upload distribution ZIP artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: core/build/distributions/core-*.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # Collect every installer and the distribution ZIP, then publish them as a
  # single GitHub Release.
  #
  # - A version tag push (v*.*.*) creates a stable release.
  # - A push to the release branch creates/updates a rolling pre-release tagged
  #   "release-latest" so the most recent build is always downloadable.
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
            PRERELEASE="false"
          else
            TAG="release-latest"
            BASE=$(echo "${GITHUB_REF_NAME}" | sed 's|.*/||')
            VERSION="${BASE}+${GITHUB_SHA:0:7}"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Download distribution ZIP
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: release-assets/

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: installer-ubuntu-latest
          path: release-assets/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows-latest
          path: release-assets/

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: installer-macos-latest
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TabletopControl ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
